<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" fill="none">
  <defs>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#635BFF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#635BFF" />
    </linearGradient>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(2, 2)">
    <rect width="32" height="32" rx="8" fill="#171B26" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <circle cx="16" cy="16" r="8" stroke="url(#orbit-grad)" stroke-width="2.5" stroke-dasharray="32 10" />
    <circle cx="21" cy="11" r="3" fill="#06B6D4" />
    <circle cx="16" cy="16" r="3.5" fill="url(#orbit-grad)" />
  </g>

  <!-- Brand Typography -->
  <text x="44" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px">
    <tspan fill="#F8FAFC">App</tspan><tspan fill="#635BFF">Orbit</tspan>
  </text>
</svg>
