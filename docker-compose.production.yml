# ==============================================================================
# APPORBIT — PRODUCTION DOCKER COMPOSE ORCHESTRATION (Phase 10)
# ==============================================================================
version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database (Internal Cluster Only)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: apporbit-prod-mongodb
    restart: always
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - apporbit-internal-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 2. Redis Distributed Cache & Session Store (Internal Cluster Only)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: apporbit-prod-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 1024mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - apporbit-internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 3. Node.js Production API Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: apporbit-prod-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - server/.env.production
    volumes:
      - apk_prod_storage:/app/storage/private
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apporbit-internal-net
      - apporbit-public-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 4. React Frontend (Nginx Production Edge Server)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: apporbit-prod-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - apporbit-public-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

networks:
  apporbit-internal-net:
    internal: true
  apporbit-public-net:
    driver: bridge

volumes:
  mongo_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  apk_prod_storage:
    driver: local
