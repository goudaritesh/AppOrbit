name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Semantic Version to deploy (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  deploy-production:
    name: Build, Gate & Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build & Test Validation Check
        run: |
          cd server && npm ci
          cd ../client && npm ci && npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Backend Container
        run: |
          docker build -t apporbit-backend:latest -f docker/Dockerfile.backend .

      - name: Build Production Frontend Container
        run: |
          docker build -t apporbit-frontend:latest \
            --build-arg VITE_API_URL=https://apporbit.io/api \
            --build-arg VITE_APP_URL=https://apporbit.io \
            --build-arg VITE_SOCKET_URL=https://apporbit.io \
            -f docker/Dockerfile.frontend .

      - name: Production Deployment Trigger
        env:
          PROD_DEPLOY_WEBHOOK: ${{ secrets.PROD_DEPLOY_WEBHOOK }}
        run: |
          if [ -n "$PROD_DEPLOY_WEBHOOK" ]; then
            curl -X POST "$PROD_DEPLOY_WEBHOOK"
            echo "Production deployment initiated."
          else
            echo "PROD_DEPLOY_WEBHOOK not set; container verified."
          fi

      - name: Post-Deployment Production Health & Readiness Verification
        run: |
          echo "Health check target: https://apporbit.io/api/health/ready"
