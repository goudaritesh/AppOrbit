name: AppOrbit Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Verification & Automated Testing
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend CI & Test Suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: server
        run: npm ci

      - name: Validate Environment Schema
        working-directory: server
        env:
          NODE_ENV: test
          PORT: 5001
          MONGODB_URI: mongodb://127.0.0.1:27017/apporbit_test
          JWT_SECRET: ci_test_jwt_secret_minimum_32_characters_long
          REFRESH_TOKEN_SECRET: ci_test_refresh_secret_minimum_32_characters_long
          CLIENT_URL: http://localhost:5173
        run: node -e "import('./src/config/envValidator.js').then(m => m.validateEnv({ exitOnError: true }))"

      - name: Run Backend Regression Test Suites (Phases 5-10)
        working-directory: server
        env:
          NODE_ENV: test
          PORT: 5001
          MONGODB_URI: mongodb://127.0.0.1:27017/apporbit_test
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci_test_jwt_secret_minimum_32_characters_long
          REFRESH_TOKEN_SECRET: ci_test_refresh_secret_minimum_32_characters_long
          CLIENT_URL: http://localhost:5173
          SECURITY_SCAN_ENABLED: 'true'
          SECURITY_PROVIDER: mock
          STORAGE_PROVIDER: local-private
        run: |
          node src/scripts/test_phase5_api.js
          node src/scripts/test_phase6_api.js
          node src/scripts/test_phase7_api.js
          node src/scripts/test_phase8_api.js

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Verification & Production Build
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: client
        run: npm ci

      - name: Build Frontend Production Bundle (Vite)
        working-directory: client
        env:
          VITE_API_URL: /api
          VITE_APP_URL: https://apporbit.io
        run: npm run build
