# ==============================================================================
# APPORBIT — DEVELOPMENT DOCKER COMPOSE ORCHESTRATION (Phase 10)
# ==============================================================================
version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database Service
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: apporbit-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - apporbit-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Redis Caching & Session Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: apporbit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - apporbit-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------------------------
  # 3. AppOrbit Node.js API Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: apporbit-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/apporbit
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=apporbit_development_grade_jwt_secret_key_minimum_64_characters_entropy_long
      - REFRESH_TOKEN_SECRET=apporbit_development_grade_refresh_token_secret_key_minimum_64_characters_entropy_long
    volumes:
      - ./server/storage:/app/storage
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apporbit-network

  # ----------------------------------------------------------------------------
  # 4. AppOrbit React Frontend (Nginx Production Server)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        - VITE_API_URL=http://localhost:5000/api
        - VITE_APP_URL=http://localhost:5173
        - VITE_SOCKET_URL=http://localhost:5000
    container_name: apporbit-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - apporbit-network

networks:
  apporbit-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
